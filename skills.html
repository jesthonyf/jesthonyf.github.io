<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills - Jesth For-og</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Courier New', monospace;
    background:linear-gradient(135deg,#0a0a0a,#1a1a1a,#0f0f1a);
    color:#d8ffd0;
    overflow-x:hidden;
}

/* Header */
header{
    background:#111;
    border-bottom:2px solid #7cff00;
    padding:15px;
    text-align:center;
}
header h1{
    color:#9cff00;
    font-size:28px;
    text-shadow:0 0 15px #7cff00;
    animation:glowText 3s infinite;
}
@keyframes glowText{
    0%,100%{color:#7cff00;text-shadow:0 0 15px #7cff00;}
    50%{color:#00ffff;text-shadow:0 0 25px #00ffff;}
}

/* Slider Container */
.slider{
    overflow:hidden;
    white-space:nowrap;
    margin:40px auto;
    max-width:1000px;
    border:2px solid #7cff00;
    border-radius:12px;
    box-shadow:0 0 25px #7cff00;
    background:#101010;
}
.slide-track{
    display:inline-flex;
    animation:scroll 35s linear infinite;
}
@keyframes scroll{
    0%{transform:translateX(0)}
    100%{transform:translateX(-50%)}
}

/* Skill Card */
.card{
    flex:0 0 auto;
    width:240px;
    height:180px;
    margin:20px;
    background:#0f0f0f;
    border:2px solid #00ffff;
    border-radius:12px;
    box-shadow:0 0 20px #00ffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    color:#9cff00;
    text-shadow:0 0 10px #7cff00;
    transition:transform .6s, box-shadow .6s;
    transform-style:preserve-3d;
    animation:float 4s ease-in-out infinite;
}
.card:hover{
    transform:rotateY(20deg) rotateX(10deg) scale(1.1);
    box-shadow:0 0 40px #ff00ff;
}

/* Floating animation */
@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

/* Rating Bar */
.rating{
    width:80%;
    height:12px;
    background:#222;
    border:1px solid #7cff00;
    border-radius:6px;
    margin-top:10px;
    overflow:hidden;
    box-shadow:0 0 10px #7cff00;
}
.fill{
    height:100%;
    background:linear-gradient(90deg,#7cff00,#00ffff,#ff00ff);
    width:0;
    animation:grow 2s forwards;
}
@keyframes grow{
    from{width:0}
    to{width:var(--level)}
}

/* Footer */
footer{
    text-align:center;
    padding:20px;
    border-top:2px solid #7cff00;
    margin-top:40px;
    color:#7cff00;
    font-size:14px;
}
</style>
</head>
<body>

<header>
