<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - Jesth For-og</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Courier New', monospace;
    background:linear-gradient(135deg,#0a0a0a,#1a1a1a,#0f0f1a);
    color:#d8ffd0;
}

/* Header */
header{
    background:#111;
    border-bottom:2px solid #7cff00;
    padding:15px;
    text-align:center;
}
header h1{
    color:#9cff00;
    font-size:28px;
    text-shadow:0 0 15px #7cff00;
    animation:glowText 3s infinite;
}
@keyframes glowText{
    0%,100%{color:#7cff00;text-shadow:0 0 15px #7cff00;}
    50%{color:#00ffff;text-shadow:0 0 25px #00ffff;}
}

/* Container */
.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
    display:grid;
    grid-template-columns:1fr;
    gap:40px;
}

/* Game Box */
.game-box{
    background:#0f0f0f;
    border:2px solid #00ffff;
    border-radius:12px;
    box-shadow:0 0 20px #00ffff;
    padding:20px;
    text-align:center;
    transition:transform .6s, box-shadow .6s;
    transform-style:preserve-3d;
}
.game-box:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 0 40px #ff00ff;
}
.game-box h2{
    color:#7cff00;
    margin-bottom:10px;
    text-shadow:0 0 10px #7cff00;
    animation:textPulse 3s infinite;
}
@keyframes textPulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.7;transform:scale(1.1);}
}

/* Neon Click Challenge */
#gameArea{
    position:relative;
    width:100%;
    height:300px;
    background:#0f1a0f;
    border:2px solid #7cff00;
    border-radius:10px;
    overflow:hidden;
    margin:20px auto;
}
.target{
    position:absolute;
    width:40px;
    height:40px;
    background:#7cff00;
    border-radius:50%;
    box-shadow:0 0 20px #9cff00;
    cursor:pointer;
    transition:.2s;
}
.target:hover{transform:scale(1.2);}
#scoreBoard{margin-top:10px;color:#00ffff;font-weight:bold;}

/* Memory Match Game */
#gameBoard{
    display:grid;
    grid-template-columns:repeat(4,100px);
    grid-gap:15px;
    justify-content:center;
    margin:20px auto;
}
.card{
    width:100px;
    height:100px;
    background:#0f1a0f;
    border:2px solid #7cff00;
    border-radius:10px;
    box-shadow:0 0 15px #7cff00;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    color:#0a0a0a;
    transition:transform .3s;
}
.card.flipped{
    background:#7cff00;
    color:#0a0a0a;
    transform:rotateY(180deg);
}
.card.matched{
    background:#00ffff;
    color:#0a0a0a;
    box-shadow:0 0 25px #00ffff;
    cursor:default;
}
#memoryScore{margin-top:10px;color:#00ffff;font-weight:bold;}

/* Footer */
footer{
    text-align:center;
    padding:20px;
    border-top:2px solid #7cff00;
    margin-top:40px;
    color:#7cff00;
    font-size:14px;
}
</style>
</head>
<body>

<header>
    <h1>☣ Games Zone</h1>
</header>

<div class="container">

    <!-- Game 1: Neon Click Challenge -->
    <div class="game-box">
        <h2>Neon Click Challenge 🎮</h2>
        <p>Click the glowing target as many times as you can within 30 seconds!</p>
        <div id="gameArea"></div>
        <div id="scoreBoard">Score: 0 | Time Left: 30s</div>
        <button onclick="startClickGame()">Start Game</button>
    </div>

    <!-- Game 2: Memory Match -->
    <div class="game-box">
        <h2>Memory Match Game 🎲</h2>
        <p>Flip the cards and match all pairs to win!</p>
        <div id="gameBoard"></div>
        <div id="memoryScore">Moves: 0 | Matches: 0</div>
        <button onclick="startMemoryGame()">Start Game</button>
    </div>

</div>

<footer>
    © 2026 Jesth For-og | Criminology Student • Creator • Future Professional
</footer>

<script>
/* Neon Click Challenge */
let score=0,timeLeft=30,gameInterval,timerInterval;
function startClickGame(){
    score=0;timeLeft=30;
    document.getElementById("scoreBoard").innerText="Score: "+score+" | Time Left: "+timeLeft+"s";
    clearInterval(gameInterval);clearInterval(timerInterval);
    spawnTarget();
    gameInterval=setInterval(spawnTarget,1000);
    timerInterval=setInterval(()=>{
        timeLeft--;
        document.getElementById("scoreBoard").innerText="Score: "+score+" | Time Left: "+timeLeft+"s";
        if(timeLeft<=0){
            clearInterval(gameInterval);clearInterval(timerInterval);
            alert("Game Over! Your final score: "+score);
            document.getElementById("gameArea").innerHTML="";
        }
    },1000);
}
function spawnTarget(){
    let gameArea=document.getElementById("gameArea");
    gameArea.innerHTML="";
    let target=document.createElement("div");
    target.className="target";
    target.style.top=Math.random()*(gameArea.clientHeight-40)+"px";
    target.style.left=Math.random()*(gameArea.clientWidth-40)+"px";
    target.onclick=function(){score++;document.getElementById("scoreBoard").innerText="Score: "+score+" | Time Left: "+timeLeft+"s";target.remove();};
    gameArea.appendChild(target);
}

/* Memory Match Game */
let icons=["☣","⚖","🎲","🚓","🕵️","📚","💻","🏆"];
let cards=[],flipped=[],moves=0,matches=0;
function startMemoryGame(){
    moves=0;matches=0;
    document.getElementById("memoryScore").innerText="Moves: 0 | Matches: 0";
    let board=document.getElementById("gameBoard");
    board.innerHTML="";
    cards=[...icons,...icons].sort(()=>Math.random()-0.5);
    cards.forEach(icon=>{
        let card=document.createElement("div");
        card.className="card";
        card.dataset.icon=icon;
        card.onclick=()=>flipCard(card);
        board.appendChild(card);
    });
}
function flipCard(card){
    if(card.classList.contains("flipped")||card.classList.contains("matched")) return;
    card.classList.add("flipped");
    card.innerText=card.dataset.icon;
    flipped.push(card);
    if(flipped.length===2){
        moves++;
        document.getElementById("memoryScore").innerText="Moves: "+moves+" | Matches: "+matches;
        if(flipped[0].dataset.icon===flipped[1].dataset.icon){
            flipped[0].classList.add("matched");
            flipped[1].classList.add("matched");
            matches++;
            document.getElementById("memoryScore").innerText="Moves: "+moves+" | Matches: "+matches;
            if(matches===icons.length){
                setTimeout(()=>alert("Congratulations! You matched all pairs in "+moves+" moves."),500);
            }
        }else{
            setTimeout(()=>{
                flipped[0].classList.remove("flipped");flipped[0].innerText="";
                flipped[1].classList.remove("flipped");flipped[1].innerText="";
            },800);
        }
        flipped=[];
    }
}
</script>

</body>
</html>
